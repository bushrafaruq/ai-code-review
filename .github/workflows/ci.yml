name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: python -m pytest -q
      - name: Seeded-defect evaluation (static + test advisor)
        run: python eval/run_eval.py
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ai-code-review .
      - name: Run container and call every service
        run: |
          docker run -d --name reviewer -p 8001:8001 ai-code-review
          for i in $(seq 1 30); do curl -sf localhost:8001/health && break; sleep 2; done
          python3 -c "import json; print(json.dumps({'diff': open('examples/sample.diff').read(), 'use_llm': False}))" > body.json
          for path in /diff/parse /checks/static /checks/tests /review; do
            curl -sf -X POST "localhost:8001$path" -H 'content-type: application/json' --data @body.json > "out_${path//\//_}.json"
          done
          python3 -c "import json; r = json.load(open('out__review.json')); assert r['verdict'] == 'request_changes', r"
      - if: failure()
        run: docker logs reviewer
